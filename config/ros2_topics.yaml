contract:
  status: accepted
  physics_clock_hz: 240
  state_tf_joint_hz: 60
  minimum_required_state_rate_hz: 50

topics:
  command:
    cmd_vel:
      name: /cmd_vel
      direction: ros2_to_simulation

  timing:
    clock:
      name: /clock
      direction: simulation_to_ros2
      expected_rate_hz: 240

  state:
    odometry_truth:
      name: /odom_truth
      direction: simulation_to_ros2
      expected_rate_hz: 60
      semantics: simulation_ground_truth
    joint_states:
      name: /joint_states
      direction: simulation_to_ros2
      expected_rate_hz: 60
    tf:
      name: /tf
      direction: simulation_to_ros2
      expected_rate_hz: 60

  perception:
    lane_camera_image:
      name: /camera/image_raw_lane
      direction: simulation_to_ros2
      expected_rate_hz_sim_time: 60
      status: verified
    lane_camera_info:
      name: /camera/camera_info
      direction: simulation_to_ros2
      expected_rate_hz_sim_time: 60
      status: verified
    lidar_scan:
      name: /scan
      direction: simulation_to_ros2
      status: verified_interface_scope

  diagnostics:
    wheel_command:
      name: /cobraflex/wheel_cmd_debug
      direction: simulation_to_ros2
      purpose: commanded_wheel_velocity_debug

notes:
  - "Lane Camera transport, payload structure, and simulation-time timestamp integrity were verified; perception equivalence was outside thesis scope."
  - "The /scan interface was verified for ROS 2 transport, frame, angular coverage, and payload structure; physical-sensor equivalence was not established."
  - "The wheel-command debug topic is diagnostic and is not part of the vehicle control path."
